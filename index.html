<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Гелиос-7 — восстанови связь</title>
<style>
  :root {
    --bg: #05090a;
    --panel: #08110f;
    --line: #173029;
    --line-bright: #2e6b55;
    --text: #cfe9dd;
    --green: #6ef2a4;
    --green-dim: #4aa77a;
    --amber: #ffc857;
    --muted: #648178;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 12% -10%, rgba(110, 242, 164, .10), transparent 42%),
      radial-gradient(circle at 92% 108%, rgba(255, 200, 87, .07), transparent 46%),
      var(--bg);
    color: var(--text);
    font-family: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, .016) 0,
      rgba(255, 255, 255, .016) 1px,
      transparent 1px,
      transparent 4px
    );
    z-index: 10;
  }

  .app {
    width: min(100% - 32px, 1000px);
    min-height: 100dvh;
    margin: 0 auto;
    padding: 22px 0 26px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .sigil {
    color: var(--green);
    font-size: 1.65rem;
    line-height: 1;
    text-shadow: 0 0 18px rgba(110, 242, 164, .65);
    animation: pulse 3.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: .7; }
    50% { opacity: 1; }
  }

  h1 {
    margin: 0;
    font-size: clamp(1.05rem, 2.4vw, 1.4rem);
    letter-spacing: .22em;
    color: #eafff4;
  }

  .brand p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: .68rem;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  .boss { min-width: 230px; }

  .boss-label {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 6px;
    color: #8eaaa0;
    font-size: .66rem;
    letter-spacing: .16em;
  }

  #hp-text { color: var(--amber); }

  .hp-track {
    display: flex;
    gap: 6px;
    height: 12px;
  }

  .pip {
    flex: 1;
    border: 1px solid #2a473d;
    border-radius: 2px;
    background: #0a1512;
    transform: skewX(-18deg);
    transition: background .25s, border-color .25s, box-shadow .25s;
  }

  .pip.on {
    border-color: #ffcf6b;
    background: linear-gradient(180deg, #ffd77a, #f0a93c);
    box-shadow: 0 0 10px rgba(255, 190, 80, .42);
  }

  .terminal-wrap {
    flex: 1;
    min-height: 360px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(6, 14, 12, .93);
    box-shadow:
      0 24px 90px rgba(0, 0, 0, .55),
      inset 0 0 0 1px rgba(110, 242, 164, .025);
  }

  .terminal-bar {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    background: #0a1512;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #2b4a3f;
  }

  .dot--red { background: #7d3d3d; }
  .dot--amber { background: #7d6a3a; }

  .term-title {
    margin-left: auto;
    color: #547167;
    font-size: .64rem;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  .terminal {
    flex: 1;
    margin: 0;
    padding: 18px;
    overflow: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    color: #a9e8c6;
    font: inherit;
    font-size: .88rem;
    line-height: 1.55;
    text-shadow: 0 0 12px rgba(110, 242, 164, .14);
    scrollbar-color: #244c3d transparent;
    scrollbar-width: thin;
  }

  .hint {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 14px;
    border: 1px solid transparent;
    border-left: 2px solid var(--line-bright);
    background: linear-gradient(90deg, rgba(20, 48, 39, .48), transparent 80%);
    color: #9ec8b8;
    font-size: .82rem;
    line-height: 1.5;
    transition: border-color .25s, color .25s;
  }

  .hint.win {
    border-left-color: var(--amber);
    color: #e4d3a6;
  }

  .hint-label {
    padding-top: 2px;
    color: var(--green);
    font-size: .64rem;
    letter-spacing: .16em;
    white-space: nowrap;
  }

  .hint.win .hint-label { color: var(--amber); }

  .hint p { margin: 0; }

  .command {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .03);
    transition: border-color .2s, box-shadow .2s;
  }

  .command:focus-within {
    border-color: var(--line-bright);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .03),
      0 0 0 3px rgba(110, 242, 164, .07);
  }

  .prompt {
    color: var(--green);
    font-size: .86rem;
    white-space: nowrap;
  }

  #input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: #e6fff3;
    font: inherit;
    font-size: .94rem;
    caret-color: var(--green);
  }

  #input::placeholder { color: #3f5b52; }

  #input:disabled { opacity: .55; }

  .reset {
    padding: 8px 11px;
    border: 1px solid #3a4d46;
    border-radius: 5px;
    background: #111d19;
    color: #9bb8ad;
    font: inherit;
    font-size: .68rem;
    letter-spacing: .07em;
    white-space: nowrap;
    cursor: pointer;
    transition: border-color .2s, color .2s, background .2s;
  }

  .reset:hover:not(:disabled) {
    border-color: var(--amber);
    background: #1a2116;
    color: #ffd77a;
  }

  .reset:disabled { opacity: .5; cursor: wait; }

  @media (max-width: 620px) {
    .app { width: min(100% - 20px, 1000px); padding-top: 14px; }
    .prompt { display: none; }
    .terminal { padding: 13px; font-size: .8rem; }
    .hint { padding: 9px 11px; }
    .boss { min-width: 100%; }
    .reset { padding: 8px; }
  }
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <span class="sigil" aria-hidden="true">◈</span>
      <div>
        <h1>ГЕЛИОС-7</h1>
        <p>терминал восстановления связи</p>
      </div>
    </div>
    <div class="boss">
      <div class="boss-label">
        <span>ПОМЕХИ НА КАНАЛЕ</span>
        <span id="hp-text">3 / 3 HP</span>
      </div>
      <div class="hp-track" id="hp-track" role="img" aria-label="3 из 3 HP"></div>
    </div>
  </header>

  <section class="terminal-wrap" aria-label="Вывод терминала">
    <div class="terminal-bar" aria-hidden="true">
      <span class="dot dot--red"></span>
      <span class="dot dot--amber"></span>
      <span class="dot"></span>
      <span class="term-title">станция · канал 7</span>
    </div>
    <pre id="terminal" class="terminal" aria-live="polite"></pre>
  </section>

  <section class="hint" id="hint-box" aria-live="polite">
    <span class="hint-label">ПОДСКАЗКА</span>
    <p id="hint">Загрузка состояния канала…</p>
  </section>

  <form class="command" id="form" autocomplete="off">
    <label class="prompt" id="prompt" for="input">cadet@helio-7:/$</label>
    <input id="input" name="command" type="text" spellcheck="false"
           autocapitalize="off" autocomplete="off" placeholder="введи команду…"
           aria-label="Команда" autofocus>
    <button class="reset" id="reset" type="button">Начать заново</button>
  </form>
</main>

<script>
(() => {
  "use strict";

  const terminal = document.getElementById("terminal");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const resetBtn = document.getElementById("reset");
  const promptEl = document.getElementById("prompt");
  const hpText = document.getElementById("hp-text");
  const hpTrack = document.getElementById("hp-track");
  const hintEl = document.getElementById("hint");
  const hintBox = document.getElementById("hint-box");

  const BANNER = [
    "╔════════════════════════════════════════════╗",
    "║   СИСТЕМА СВЯЗИ «ГЕЛИОС-7»  //  КАНАЛ 7    ║",
    "╚════════════════════════════════════════════╝",
    "",
    "Связь со станцией потеряна. На канале — 3 HP помех.",
    "Выполни три задачи, чтобы восстановить передатчик.",
    "",
    "Доступные команды: pwd, ls, cd, cat, grep",
    ""
  ].join("\n");

  // При открытии через file:// сервер недоступен, поэтому включается
  // автономный режим: вся игра работает прямо в этой HTML-странице.
  const LOCAL_MODE = window.location.protocol === "file:";
  const localGame = LOCAL_MODE ? createLocalGame() : null;

  function createLocalGame() {
    const MAX_HP = 3;
    // Копия missionFS из game.go: при изменении файлов правь оба места.
    const FILES = {
      "/": { dir: true },
      "/station": { dir: true },
      "/station/brief.txt": {
        data: `БОРТОВОЙ ЖУРНАЛ СТАНЦИИ «ГЕЛИОС-7»
Запись от 14.11.2087

После сбоя питания основной канал связи не отвечает.
Передатчик, скорее всего, цел: аварийный модуль должен
был перейти в режим ожидания.

В журнале событий (events.log) последняя запись о состоянии
передатчика помечена маркером READY. Найди эту строку —
по ней мы поймём, что канал можно восстанавливать.

Не запускай перезагрузку антенны, пока не увидишь READY.`
      },
      "/station/events.log": {
        data: `2087-11-14T02:11:03Z boot power-on
2087-11-14T02:11:04Z reactor: nominal
2087-11-14T02:11:19Z comm: carrier lost
2087-11-14T02:12:40Z antenna: parked
2087-11-14T02:15:02Z diagnostic: transmitter self-test
2087-11-14T02:15:03Z transmitter: OFFLINE (no power)
2087-11-14T02:18:27Z solar array: charging
2087-11-14T02:41:55Z battery: 82%
2087-11-14T03:02:10Z transmitter: warming up
2087-11-14T03:04:44Z transmitter: READY
2087-11-14T03:05:01Z comm: handshake available`
      },
      "/station/antenna.conf": {
        data: `# Конфигурация антенны «Гелиос-7»
band = X
azimuth = 117
elevation = 24
auto_restart = false`
      }
    };

    let cwd = "/";
    let viewedStation = false;
    let readBrief = false;
    let foundReady = false;

    function normalize(input) {
      const stack = [];
      for (const part of input.split("/")) {
        if (!part || part === ".") continue;
        if (part === "..") {
          stack.pop();
        } else {
          stack.push(part);
        }
      }
      return "/" + stack.join("/");
    }

    function resolve(arg) {
      return arg.startsWith("/")
        ? normalize(arg)
        : normalize(cwd + "/" + arg);
    }

    function parentOf(p) {
      const i = p.lastIndexOf("/");
      return i <= 0 ? "/" : p.slice(0, i);
    }

    function baseOf(p) {
      return p.slice(p.lastIndexOf("/") + 1);
    }

    function childrenOf(dir) {
      const names = [];
      for (const [p, node] of Object.entries(FILES)) {
        if (p === "/" || p === dir || parentOf(p) !== dir) continue;
        names.push(baseOf(p) + (node.dir ? "/" : ""));
      }
      return names.sort();
    }

    function hint() {
      if (viewedStation && readBrief && foundReady) {
        return "Связь восстановлена. Можно осмотреться или начать миссию заново.";
      }
      if (!viewedStation) {
        if (cwd === "/station") {
          return "Ты в каталоге /station. Выполни ls, чтобы осмотреть его содержимое.";
        }
        return "Осмотри корень файловой системы и найди каталог станции. Пригодятся ls и cd.";
      }
      if (!readBrief) {
        return "В каталоге /station лежит brief.txt. Прочитай его командой cat.";
      }
      return "В журнале events.log найди строку с маркером READY. Используй grep СЛОВО ФАЙЛ.";
    }

    function snapshot() {
      const done = Number(viewedStation) + Number(readBrief) + Number(foundReady);
      return {
        cwd: cwd,
        hp: MAX_HP - done,
        max_hp: MAX_HP,
        done: done,
        won: done === MAX_HP,
        hint: hint()
      };
    }

    function run(line) {
      const fields = line.trim().split(/\s+/).filter(Boolean);
      if (!fields.length) return "";

      const cmd = fields[0];
      const args = fields.slice(1);

      if (cmd === "pwd") {
        if (args.length !== 0) return "pwd: команда не принимает аргументов";
        return cwd;
      }

      if (cmd === "ls") {
        if (args.length > 1) {
          return "ls: слишком много аргументов\nиспользование: ls [путь]";
        }
        const arg = args.length === 1 ? args[0] : ".";
        const target = resolve(arg);
        const node = FILES[target];
        if (!node) return "ls: " + arg + ": нет такого файла или каталога";
        if (!node.dir) return baseOf(target);

        if (target === "/station") viewedStation = true;

        const names = childrenOf(target);
        return names.length ? names.join("\n") : "(пусто)";
      }

      if (cmd === "cd") {
        if (args.length > 1) {
          return "cd: слишком много аргументов\nиспользование: cd [путь]";
        }
        let target = "/";
        let display = "/";
        if (args.length === 1) {
          display = args[0];
          target = resolve(args[0]);
        }
        const node = FILES[target];
        if (!node) return "cd: " + display + ": нет такого файла или каталога";
        if (!node.dir) return "cd: " + display + ": не каталог";
        cwd = target;
        return "";
      }

      if (cmd === "cat") {
        if (args.length !== 1) return "cat: использование: cat ФАЙЛ";
        const target = resolve(args[0]);
        const node = FILES[target];
        if (!node) return "cat: " + args[0] + ": нет такого файла или каталога";
        if (node.dir) return "cat: " + args[0] + ": это каталог";
        if (target === "/station/brief.txt") readBrief = true;
        return node.data.replace(/\n+$/, "");
      }

      if (cmd === "grep") {
        if (args.some((arg) => arg.startsWith("-"))) {
          return "grep: флаги не поддерживаются\nиспользование: grep СЛОВО ФАЙЛ";
        }
        if (args.length !== 2) {
          return "grep: использование: grep СЛОВО ФАЙЛ\nфлаги и регулярные выражения не поддерживаются";
        }

        const pattern = args[0];
        const fileArg = args[1];
        const target = resolve(fileArg);
        const node = FILES[target];
        if (!node) return "grep: " + fileArg + ": нет такого файла или каталога";
        if (node.dir) return "grep: " + fileArg + ": это каталог";

        const lines = node.data.replace(/\n+$/, "").split("\n");
        const matches = lines.filter((row) => row.includes(pattern));
        if (!matches.length) {
          return "grep: «" + pattern + "» не найдено в " + baseOf(target);
        }
        if (target === "/station/events.log" && pattern === "READY") {
          foundReady = true;
        }
        return matches.join("\n");
      }

      return "команда не найдена: " + cmd + "\nДоступные команды: pwd, ls, cd, cat, grep";
    }

    return {
      state: snapshot,
      execute: (line) => ({ output: run(line), state: snapshot() }),
      reset: () => {
        cwd = "/";
        viewedStation = false;
        readBrief = false;
        foundReady = false;
        return snapshot();
      }
    };
  }

  let state = { cwd: "/", hp: 3, max_hp: 3, done: 0, won: false, hint: "" };
  let history = [];
  let historyPos = 0;
  let busy = false;

  function append(text) {
    if (!text) return;
    terminal.textContent += text.endsWith("\n") ? text : text + "\n";
    terminal.scrollTop = terminal.scrollHeight;
  }

  function promptText(cwd) {
    return "cadet@helio-7:" + cwd + "$";
  }

  function render(next) {
    state = next;
    promptEl.textContent = promptText(next.cwd);
    hpText.textContent = next.hp + " / " + next.max_hp + " HP";
    hpTrack.replaceChildren();
    for (let i = 0; i < next.max_hp; i++) {
      const pip = document.createElement("span");
      pip.className = "pip" + (i < next.hp ? " on" : "");
      hpTrack.appendChild(pip);
    }
    hpTrack.setAttribute("aria-label", next.hp + " из " + next.max_hp + " HP");
    hintEl.textContent = next.hint;
    hintBox.classList.toggle("win", next.won);
    document.title = next.won
      ? "Связь восстановлена — Гелиос-7"
      : "Гелиос-7 — восстанови связь";
  }

  async function fetchState() {
    if (localGame) return localGame.state();

    const res = await fetch("/api/state", {
      headers: { "Accept": "application/json" }
    });
    if (!res.ok) {
      throw new Error("HTTP " + res.status);
    }
    return res.json();
  }

  async function send(command) {
    if (localGame) return localGame.execute(command);

    const res = await fetch("/api/command", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ command: command })
    });
    if (!res.ok) {
      throw new Error("HTTP " + res.status);
    }
    return res.json();
  }

  async function resetGame() {
    if (localGame) return localGame.reset();

    const res = await fetch("/api/reset", { method: "POST" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (busy) return;

    const command = input.value.trim();
    input.value = "";
    if (!command) return;

    history.push(command);
    historyPos = history.length;

    append(promptText(state.cwd) + " " + command);
    busy = true;
    input.disabled = true;

    try {
      const data = await send(command);
      append((data.output || "").trimEnd());

      const wasWon = state.won;
      render(data.state);

      if (!wasWon && data.state.won) {
        append("");
        append("╔════════════════════════════════════════════╗");
        append("║        СВЯЗЬ ВОССТАНОВЛЕНА                 ║");
        append("╚════════════════════════════════════════════╝");
        append("Станция снова на связи. Отличная работа, кадет.");
        append("Нажми «Начать заново», чтобы пройти миссию ещё раз.");
      }
    } catch (err) {
      append("[сбой канала: " + err.message + "]");
    } finally {
      busy = false;
      input.disabled = false;
      input.focus();
    }
  });

  input.addEventListener("keydown", (event) => {
    if (event.key === "ArrowUp") {
      if (!history.length) return;
      event.preventDefault();
      historyPos = Math.max(0, historyPos - 1);
      input.value = history[historyPos];
      input.setSelectionRange(input.value.length, input.value.length);
    } else if (event.key === "ArrowDown") {
      if (!history.length) return;
      event.preventDefault();
      historyPos = Math.min(history.length, historyPos + 1);
      input.value = historyPos === history.length ? "" : history[historyPos];
      input.setSelectionRange(input.value.length, input.value.length);
    }
  });

  resetBtn.addEventListener("click", async () => {
    if (busy) return;
    busy = true;
    input.disabled = true;
    resetBtn.disabled = true;

    try {
      const next = await resetGame();

      history = [];
      historyPos = 0;
      terminal.textContent = "";
      append(BANNER);
      render(next);
    } catch (err) {
      append("[сбой канала: " + err.message + "]");
    } finally {
      busy = false;
      input.disabled = false;
      resetBtn.disabled = false;
      input.focus();
    }
  });

  async function init() {
    try {
      render(await fetchState());
    } catch (err) {
      hintEl.textContent = "Не удалось загрузить состояние. Перезагрузи страницу.";
    }

    terminal.textContent = "";
    append(BANNER);
    input.focus();
  }

  init();
})();
</script>
</body>
</html>
